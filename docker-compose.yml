services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: outlet_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d outlet_ops']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
