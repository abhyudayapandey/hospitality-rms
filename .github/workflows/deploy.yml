name: Deploy

# Manual only. Builds the linux-arm64 release bundle here (the instance never builds),
# uploads it to the deploy bucket, and runs the fixed OutletOps-Deploy SSM document on
# the app instance. See docs/deploy.md and ADR 005.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: read # the gate below reads this commit's CI results
  id-token: write # GitHub OIDC -> AWS role (no stored AWS keys)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Required reviewers are configured on this environment; the AWS role trusts only it.
    environment: production
    env:
      AWS_REGION: ap-south-1
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      # Only master, and only a commit whose CI passed (ADR 171, review M48).
      - name: Only master with green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "Deploy runs on master only, not $GITHUB_REF." >&2
            exit 1
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name | test("^(static|db \\([0-9]+\\)|e2e \\([0-9]+\\))$"))]
                  | group_by(.name) | map(max_by(.id))')
          # the newest run of each check counts (a re-run replaces a failed one)
          echo "$runs" | jq -r '.[] | "\(.name): \(.status) \(.conclusion)"'
          need=$(echo "$runs" | jq '[.[] | .name] | unique | length')
          bad=$(echo "$runs" | jq '[.[] | select(.conclusion != "success")] | length')
          if [ "$need" -lt 7 ] || [ "$bad" -ne 0 ]; then
            echo "CI has not passed on $GITHUB_SHA (static, db 1-3 and e2e 1-3 must all pass)." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build release bundle
        run: infra/scripts/build-release.sh "$GITHUB_SHA"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Upload release
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: aws s3 cp "dist/release-$GITHUB_SHA.tgz" "s3://$DEPLOY_BUCKET/releases/$GITHUB_SHA.tgz"

      - name: Run deploy on the instance
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: |
          set -euo pipefail
          cmd=$(aws ssm send-command --document-name OutletOps-Deploy \
            --instance-ids "$INSTANCE_ID" --parameters "release=$GITHUB_SHA" \
            --comment "deploy $GITHUB_SHA" --query Command.CommandId --output text)
          echo "command id: $cmd"
          # Poll (up to ~25 min); the document itself times out at 20 min.
          for _ in $(seq 1 150); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$cmd" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending | InProgress | Delayed) continue ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status: $status"
          test "$status" = Success
